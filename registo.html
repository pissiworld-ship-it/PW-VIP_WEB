<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo VIP | PW-VIP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #090612, #24103d, #10091c);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      background: rgba(25, 14, 40, 0.96);
      border: 1px solid #7544a5;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(139, 63, 219, 0.2);
      text-align: center;
    }

    .coroa {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      color: #d8b4ff;
      margin: 8px 0;
    }

    .subtitulo {
      color: #c8bdd6;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      text-align: left;
      margin: 16px 0 7px;
      color: #e4d3f7;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #67418a;
      border-radius: 10px;
      background: #120b1d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #c084fc;
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15);
    }

    .explicacao {
      display: block;
      text-align: left;
      margin-top: 18px;
      color: #60a5fa;
      text-decoration: underline;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #a78bfa;
    }

    .nota {
      color: #b8a9c9;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 18px;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      color: #d8b4ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="coroa">👑</div>

    <h1>Registo VIP</h1>
    <p class="subtitulo">Cria a tua conta VIP na PW-VIP.</p>

    <form id="registoForm">
      <label for="email">Endereço de email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="O teu email"
        autocomplete="email"
        required
      >

      <label for="codigo">Código de verificação</label>
      <input
        id="codigo"
        name="codigo"
        type="text"
        placeholder="Código recebido por email"
        autocomplete="one-time-code"
        required
      >

      <label for="username">Nome de utilizador</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Escolhe um nome"
        autocomplete="username"
        minlength="3"
        maxlength="20"
        required
      >

      <label for="password">Palavra-passe da conta PW-VIP</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Cria uma palavra-passe"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <a
        class="explicacao"
        href="https://1drv.ms/w/c/BFA0B1132C5FB88E/IQAb8BFH1GecQozb-wrHaTvXAQsEHebj_FT3d9N922ZlspM?e=JbeAFn"
        target="_blank"
        rel="noopener noreferrer"
      >Explicação</a>

      <button type="submit">Continuar →</button>
    </form>

    <p class="nota">
      A palavra-passe é para a tua conta PW-VIP, não para a tua conta de email.
    </p>

    <a class="voltar" href="index.html">← Voltar ao início</a>
  </main>

  <script>
    document.getElementById("registoForm").addEventListener("submit", function(event) {
      event.preventDefault();

      alert("O formulário visual está pronto! Falta ligar a verificação de email e a criação da conta.");
    });
  </script>
</body>
</html>
