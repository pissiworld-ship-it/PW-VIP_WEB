<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta VIP | PW-VIP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #090612, #24103d, #10091c);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      background: #190e28;
      border: 1px solid #7544a5;
      border-radius: 20px;
      box-shadow: 0 0 35px #8b3fdb33;
    }

    .coroa {
      font-size: 48px;
      text-align: center;
    }

    h1 {
      color: #d8b4ff;
      text-align: center;
      margin: 10px 0;
    }

    .subtitulo {
      color: #c8bdd6;
      text-align: center;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #e4d3f7;
      font-size: 14px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #67418a;
      border-radius: 10px;
      background: #120b1d;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #a78bfa;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #a78bfa;
    }

    button:disabled {
      background: #514363;
      color: #c5b9d3;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #mensagem {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      color: #fca5a5;
    }

    .explicacao {
      display: block;
      margin-top: 18px;
      color: #60a5fa;
    }

    .nota {
      margin-top: 18px;
      color: #b8a9c9;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .voltar {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #d8b4ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="coroa">👑</div>

    <h1>Criar conta VIP</h1>
    <p class="subtitulo">
      Cria a tua conta e confirma o teu email.
    </p>

    <form id="registoForm">
      <label for="username">Nome de utilizador</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Escolhe o teu nome"
        autocomplete="username"
        minlength="3"
        maxlength="20"
        required
      >

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="O teu endereço de email"
        autocomplete="email"
        required
      >

      <label for="password">Palavra-passe da conta</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Cria a tua palavra-passe"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="enviarCodigo" type="button">
        Enviar código para o email
      </button>

      <label for="codigo">Código de verificação</label>
      <input
        id="codigo"
        name="codigo"
        type="text"
        placeholder="Introduz o código recebido"
        autocomplete="one-time-code"
        inputmode="numeric"
        disabled
        required
      >

      <button id="continuar" type="submit" disabled>
        Continuar →
      </button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>

    <a
      class="explicacao"
      href="https://1drv.ms/w/c/BFA0B1132C5FB88E/IQAb8BFH1GecQozb-wrHaTvXAQsEHebj_FT3d9N922ZlspM?e=JbeAFn"
      target="_blank"
      rel="noopener noreferrer"
    >Explicação</a>

    <p class="nota">
      Os teus dados serão usados para criar a tua conta PW-VIP.
    </p>

    <a class="voltar" href="index.html">← Voltar ao início</a>
  </main>

  <script>
    const form = document.getElementById("registoForm");
    const enviarCodigo = document.getElementById("enviarCodigo");
    const codigo = document.getElementById("codigo");
    const continuar = document.getElementById("continuar");
    const mensagem = document.getElementById("mensagem");

    enviarCodigo.addEventListener("click", () => {
      if (!form.reportValidity()) return;

      mensagem.textContent =
        "O formulário visual está pronto. Falta ligar o envio do código ao Supabase.";
    });

    codigo.addEventListener("input", () => {
      continuar.disabled = true;
      mensagem.textContent =
        "O código ainda não foi verificado.";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      mensagem.textContent =
        "Falta ligar a verificação real do código e a criação da conta ao Supabase.";
    });
  </script>
</body>
</html>
